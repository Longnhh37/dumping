[package]
name = "proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
tokio = { version = "1", features= ["full"] }
serde = { version = "1", features= ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json"] }

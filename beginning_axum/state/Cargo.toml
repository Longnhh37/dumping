[package]
name = "axum_state"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
tokio = { version = "1", features= ["full"] }
serde = { version = "1", features= ["derive"] }
serde_json = "1"
axum-extra = { version = "0.12.6", features = ["typed-header"] }

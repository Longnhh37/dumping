[package]
name = "rurl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.3", features = ["json", "multipart", "cookies", "query", "form"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"
heck = "0.5.0"
rpassword = "7.5.2"
toml = "1.1.2"
dirs = "6.0.0"
lazy_static = "1.5.0"
indexmap = { version = "2.14.0", features = ["serde"] }
url = "2.5.8"

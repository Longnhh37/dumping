[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"


[dependencies]
actix-web = "4.5.0"
actix-web-flash-messages = { version = "0.3", features = ["cookies"] }
anyhow = "1.0.102"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
chrono = "0.4.44"
claim = "0.5.0"
config = "0.15.22"
dotenvy = "0.15.7"
hex = "0.4"
hmac = { version = "0.12", features = ["std"] }
htmlescape = "0.3.1"
once_cell = "1.21.4"
rand = { version = "0.10.1", features = ["std_rng"] }
rand_core = { version = "0.6", features = ["std"] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.149"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.37", features = ["macros", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.21"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.2"
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
fake = { version = "5.1", features = ["derive"] }
linkify = "0.11.0"
quickcheck = "1.1"
quickcheck_macros = "1.2"
wiremock = "0.6.5"

[dependencies.sqlx]
version = "0.8.1"
default-features = false
features = [
	"runtime-tokio-rustls",
	"macros",
	"postgres",
	"uuid",
	"chrono",
	"migrate",
]

[dependencies.reqwest]
version = "0.11"
default-features = false
features = ["json", "rustls-tls", "cookies"]

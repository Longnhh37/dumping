[package]
name = "ingress"
version = "0.1.0"
edition.workspace = true

[dependencies]
auth_server = { path = "../nanoservices/auth/networking/axum_server/", package = "auth-axum-server" }
auth_dal = { path = "../nanoservices/auth/dal/", package = "auth-dal" }
rust-embed = "8.13.0"
mime_guess = "2.0.5"
axum.workspace = true
tokio.workspace = true
dotenvy.workspace = true
tower-http = { version = "0.7.1", features = ["cors"] }
to-do-dal = { path = "../nanoservices/to_do/dal/", features = [
  "sqlx-postgres",
] }
to-do-axum-server = { path = "../nanoservices/to_do/networking/axum_server/" }
glue = { path = "../glue", features = ["sqlx"] }

[dev-dependencies]
tower.workspace = true

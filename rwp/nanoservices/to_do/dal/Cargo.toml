[package]
name = "to-do-dal"
version = "0.1.0"
edition = "2024"

[features]
json-file = ["serde_json"]
sqlx-postgres = ["sqlx"]

[dependencies]
sqlx = { version = "0.9", features = ["postgres", "json"], optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1" }

glue = { path = "../../../glue" }

[package]
name = "to-do-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "to_do_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
clap = { version = "4.5.16", features = ["derive"] }
to-do-dal = { path = "../dal" }
glue = { path = "../../../glue" }

[dev-dependencies]
tokio.workspace = true

[features]
json-file-storage = ["to-do-dal/json-file"]
default = ["json-file-storage"]

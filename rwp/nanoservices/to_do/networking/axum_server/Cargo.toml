[package]
name = "to-do-axum-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
tokio.workspace = true
axum.workspace = true
dotenvy.workspace = true
to-do-core = { path = "../../core" }
glue = { path = "../../../../glue", features = ["axum"] }
tracing.workspace = true
to-do-dal = { path = "../../dal/", features = ["sqlx-postgres"] }
auth-kernel = { path = "../../../auth/kernel/" }
auth-dal = { path = "../../../auth/dal/", optional = true }

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true

[features]
auth-http = ["auth-kernel/http"]
auth-core-postgres = ["auth-kernel/core-postgres", "auth-dal"]
default = ["auth-core-postgres"]

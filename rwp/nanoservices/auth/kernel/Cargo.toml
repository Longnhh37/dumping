[package]
name = "auth-kernel"
version = "0.1.0"
edition.workspace = true

[dependencies]
auth-core = { path = "../core/", optional = true }
auth-dal = { path = "../dal/", optional = true }
glue = { path = "../../../glue/" }
reqwest = { version = "0.13.5", optional = true, features = ["json"] }

[features]
http = ["reqwest", "auth-dal"]
core-postgres = ["auth-core", "auth-dal"]

services:
  postgres:
    container_name: "to-do-postgres"
    image: "postgres:18"
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-auth-db.sql:/docker-entrypoint-initdb.d/10-auth-db.sql:ro
    environment:
      - "POSTGRES_USER=username"
      - "POSTGRES_DB=to_do"
      - "POSTGRES_PASSWORD=password"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d to_do"]
      interval: 2s
      timeout: 3s
      retries: 30

  cache:
    container_name: "to-do-redis"
    build:
      context: .
      dockerfile: nanoservices/user-session-cache/cache-module/Dockerfile
    restart: always
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"

volumes:
  postgres_data:

[workspace]
resolver = "3"
members = [
  "frontend/rust-interface",
  "glue",
  "ingress",
  "nanoservices/auth/core",
  "nanoservices/auth/dal",
  "nanoservices/auth/networking/axum_server",
  "nanoservices/to_do/core",
  "nanoservices/to_do/dal",
  "nanoservices/to_do/networking/axum_server",
]

[workspace.dependencies]
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1.36.0", features = ["full"] }
sqlx = { version = "0.9.0", features = [
  "postgres",
  "json",
  "migrate",
  "runtime-tokio",
  "macros",
] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

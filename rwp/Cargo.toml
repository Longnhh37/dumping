[workspace.package]
edition = "2024"

[workspace]
resolver = "3"
members = [
  "frontend/rust-interface",
  "glue",
  "ingress",
  "nanoservices/auth/kernel",
  "nanoservices/auth/core",
  "nanoservices/auth/dal",
  "nanoservices/auth/networking/axum_server",
  "nanoservices/to_do/core",
  "nanoservices/to_do/dal",
  "nanoservices/to_do/networking/axum_server",
  "nanoservices/user-session-cache/cache-client", "nanoservices/user-session-cache/cache-module",
]

[workspace.dependencies]
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1.36.0", features = ["full"] }
sqlx = { version = "0.9.0", features = [
  "postgres",
  "json",
  "migrate",
  "runtime-tokio",
  "macros",
] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
chrono = "0.4.45"
reqwest = { version = "0.13.5", features = ["json"] }
tower-http = { version = "0.7.1", features = ["trace"] }
